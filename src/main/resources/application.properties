debug=true

spring.application.name=usermanager
spring.profiles.active=@activatedproperties@

springdoc.api-docs.path=/api-docs

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

usermanager.s3.bucket=users-manager-profiles

# Cluster-internal Service DNS name for messagemanager -- plain http, no ingress
# involved, since both apps run in the same senthil-apis namespace.
messagemanager.base-url=${MESSAGEMANAGER_URL:http://messagemanager:8080}

# Standalone by default. Setting SPRING_DATA_REDIS_CLUSTER_NODES (not referenced here, so
# it stays absent unless the env var is actually set) switches Lettuce into cluster mode
# instead -- don't add a placeholder default for it, an empty-string default would still
# count as "present" and force cluster mode with zero nodes.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.cluster.refresh.adaptive=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
