debug=true

spring.application.name=usermanager
spring.profiles.active=@activatedproperties@

springdoc.api-docs.path=/api-docs

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

usermanager.s3.bucket=users-manager-profiles

# Cluster-internal Service DNS name for messagemanager -- plain http, no ingress
# involved, since both apps run in the same senthil-apis namespace.
messagemanager.base-url=${MESSAGEMANAGER_URL:http://messagemanager:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
